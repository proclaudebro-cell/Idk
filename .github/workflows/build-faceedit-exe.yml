name: Build FaceEdit (Windows exe)
on:
  workflow_dispatch:
  push:
    paths: ["FaceEdit/**"]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: FaceEdit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name FaceEdit --collect-data cv2 --collect-binaries imageio_ffmpeg --collect-data imageio_ffmpeg app.py
      - uses: actions/upload-artifact@v4
        with:
          name: FaceEdit-windows
          path: FaceEdit/dist/FaceEdit.exe
