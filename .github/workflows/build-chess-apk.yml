name: Build Chess APK

on:
  push:
    paths:
      - "chess/**"
      - ".github/workflows/build-chess-apk.yml"
  pull_request:
    paths:
      - "chess/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine and coach tests
        run: node --test chess/tests/engine.test.js chess/tests/coach.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: chess
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChessCoach-debug-apk
          path: chess/app/build/outputs/apk/debug/app-debug.apk
